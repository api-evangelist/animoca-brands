aid: animoca-brands
name: Animoca Brands
description: 'Animoca Brands is a Web3 company focused on advancing digital property rights and building
  the open metaverse through blockchain technology, gaming, and digital assets. Founded in Hong Kong,
  the company operates a portfolio of consumer products including The Sandbox, Moca Network (digital
  identity), Open Campus (education), and Anichess, alongside institutional offerings such as Anchorpoint
  Financial (stablecoins and real-world assets) and NUVA (treasury management). Animoca Brands is also
  one of the most active investors in Web3, backing 600+ builders across gaming, infrastructure, real-world
  assets, and digital-ownership platforms. This profile was surfaced as a portfolio company of the SoftBank
  Vision Fund and added to the API Evangelist network; Animoca operates primarily as a holding and
  investment company and does not publish a first-party public developer API.'
